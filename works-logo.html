<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Noto Serif JP", serif;
    color:#6b4040;
    background:#fff;
}


header{
    position:fixed;
    top:0;
    width:100%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0px 60px;
    background-image:url("img/mokomoko.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    height:130px;  /* ←超重要 */

    z-index:100;
}




.logo img {
    width: 120px;   /* 好きな大きさに変更 */
    height: auto;
    display: block;
    position: relative;
    left: -60px; /* 数字を大きくするとさらに左へ */
    padding-top: 20px;
}


nav ul{
    display:flex;
    gap:40px;
    list-style:none;
}

nav a{
    text-decoration:none;
    color:#6b4040;
    font-weight:bold;
}

.hero{
    width:100%;
    height:100vh;

    background:url("img/buruberi.png") center center/cover no-repeat;
    margin-top: 90px;
}


.work-card .number {
    position:absolute;
    top:-15px;
    right:-15px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#b59b9b;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
}

.bottom-text {
    position:absolute;
    bottom:20px;       /* ←ここで高さ調整できる */
    left:50%;
    transform:translateX(-50%);
    font-size:20px;
    font-weight:bold;
    color:#4d292e;
    background:none;   /* 丸バッジの背景を消す */
    width:auto;
    height:auto;
    white-space: nowrap;   /* ←これが一行固定の魔法！ */
}

.cursor {
    position: fixed;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 9999;

    background: rgba(230, 214, 255, 0.551);
    box-shadow:
        0 0 10px rgba(218, 200, 255, 0.9),
        0 0 30px rgba(255, 180, 220, 0.7),
        0 0 40px rgba(255, 160, 210, 0.5);

    backdrop-filter: blur(4px);
    transition: 0.12s ease;
}
</style>
