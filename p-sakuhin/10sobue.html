<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<title>作品01</title>

</head>

<body>

<div class="work-detail">

  <a href="../works-poster.html" class="back">
    <img src="../sakuhin/sahuhin/back.png" alt="Back">
</a>

    <div class="left">

        <img src="../noseru/sobue.png" alt="祖父江イチョウ">
    </div>

    <div class="right">

        <div class="text-box">

            <h2>祖父江イチョウ黄葉まつりポスター</h2>

            <img src="sahuhin/ribon.png" alt="">

            <p>
                地元の有名なお祭りである黄葉まつりの<br>
                ポスターをIllustratorを活用し、制作しました。<br>
                若い世代や外国人をペルソナに意識しました。
            </p>

        </div>

    </div>

</div>
<div class="cursor"></div>

<script>
document.addEventListener("mousemove", function(e){
    const cursor = document.querySelector(".cursor");
    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";
});
</script>

</body>
</html>

<style>

body{

    margin:0;

    background:url("../sakuhin/sahuhin/sakuhai.png");

    background-size:cover;

    font-family:"Noto Serif JP", serif;

}

.work-detail{

    width:90%;

    margin:50px auto;

    display:flex;

    justify-content:center;

    gap:60px;

}

.left img{

    width:500px;

    border-radius:20px;
    margin-top: 60px;

}

.text-box{

    width:500px;

    background:white;

    border-radius:30px;

    padding:40px;

    text-align:center;
    margin-top: 150px;

}

.text-box h2{

    color:#7d4a4a;

    font-size:40px;

}

.text-box p{

    margin-top:30px;

    line-height:2;

}

.back{
    position:absolute;
    top:40px;
    left:40px;
}

.back img{
    width:180px;   /* 好きな大きさ */
    height:auto;
    transition:0.3s;
}

.back img:hover{
    transform:scale(1.05);
}

body {
    animation: fadein 0.8s ease;
}
@keyframes fadein {
    from { opacity: 0; }
    to   { opacity: 1; }
}

.cursor {
    position: fixed;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 9999;

    background: rgba(230, 214, 255, 0.8);
    box-shadow:
        0 0 10px rgba(218, 200, 255, 0.9),
        0 0 30px rgba(255, 180, 220, 0.7),
        0 0 40px rgba(255, 160, 210, 0.5);

    backdrop-filter: blur(4px);
    transition: 0.12s ease;
}
</style>
